name: Refresh profile statistics

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/**'
      - '.github/workflows/update-profile-stats.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: write

jobs:
  update-profile-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate local stats cards
        run: python scripts/update_profile_stats.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/languages.svg
          if git diff --cached --quiet; then
            echo "Profile stats are already current."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi